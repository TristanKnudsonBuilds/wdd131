<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recipe Book</title>

  <meta property="og:type" content="website">
  <meta property="og:title" content="Recipe Book">
  <meta property="og:description" content="A simple recipe book featuring delicious recipes.">
  <meta property="og:url" content="https://TristanKnudsonBuilds.github.io/wdd131/recipes/">
  <meta property="og:image" content="images/apple-crisp.jpg">

  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Recipe Book">
  <meta name="twitter:description" content="Browse delicious recipes.">
  <meta name="twitter:image" content="images/apple-crisp.jpg">

  <link rel="apple-touch-icon" href="images/recipe-book.png">
  <link rel="stylesheet" href="styles.css">
</head>

<body>

<header>
  <div class="logo-title">
    <img src="images/recipe-book.png" alt="Recipe Book logo">
    <h1>Recipe Book</h1>
  </div>

  <form class="search">
    <input
      type="search"
      placeholder="Find a recipe"
      aria-label="Search recipes">

    <button type="submit" aria-label="Search">
      <img src="images/search.svg" alt="">
    </button>
  </form>
</header>

<main id="recipe-container">
  <!-- JavaScript inserts recipe cards here -->
</main>

<footer>

  <a href="https://www.flaticon.com/free-icons/recipe"
     title="recipe icons">
    Recipe icons created by Freepik - Flaticon
  </a>

  <div class="social">
    <a href="#"><img src="images/instagram_icon.svg" alt="Instagram icon"></a>
    <a href="#"><img src="images/youtube_icon.svg" alt="YouTube icon"></a>
    <a href="#"><img src="images/pinterest_icon.svg" alt="Pinterest icon"></a>
  </div>

</footer>

<script src="recipes.js"></script>

</body>
</html>
